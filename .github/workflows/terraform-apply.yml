name: Terraform Apply

on:
  push:
    branches: [ main ]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'Type "apply" to confirm deployment'
        required: true
        default: ''

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    environment:
      name: production
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Validate Manual Trigger
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ "${{ github.event.inputs.confirm_apply }}" != "apply" ]; then
          echo "Manual deployment cancelled. You must type 'apply' to confirm."
          exit 1
        fi
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive
      
    - name: Terraform Init
      id: init
      run: terraform init
      env:
        # Add your cloud provider credentials here
        # For AWS:
        # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # For Azure:
        # ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        # ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        # ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        # ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        # For GCP:
        # GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        
    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color
      
    - name: Setup Kubernetes Config
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        
    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false -out=tfplan
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        
    - name: Terraform Apply
      id: apply
      run: terraform apply -auto-approve tfplan
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        
    - name: Terraform Output
      id: output
      run: terraform output -json
      continue-on-error: true
      
    - name: Create Deployment Summary
      run: |
        echo "## Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status: ✅ Successfully Applied" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ArgoCD Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace:** argocd" >> $GITHUB_STEP_SUMMARY
        echo "- **Chart Version:** 8.2.5" >> $GITHUB_STEP_SUMMARY
        echo "- **ArgoCD Version:** v3.0.12" >> $GITHUB_STEP_SUMMARY
        echo "- **Domain:** argocd.kangdeploy.web.id" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ steps.output.outputs.stdout }}" ]; then
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.output.outputs.stdout }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
